<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Teva | Contact</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../style/theme.css">
	<link rel="stylesheet" href="../style/contact.css">
</head>
<body class="subpage saber-dark">
	<header>
		<nav class="navbar">
			<div class="logo"><span class="logo-saber"></span>PORTFOLIO</div>
			<ul class="nav-links">
				<li><a href="../index.html">Accueil</a></li>
				<li><a href="./projects.html">Projets</a></li>
				<li><a href="./stages.html">Stages</a></li>
				<li><a href="./veille.html">Veille</a></li>
				<li><a href="./bilan.html">Synthèse</a></li>
				<li><a href="./contact.html" class="btn-contact active">Contact</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section id="contact" class="container">
			<h2 data-kicker="Transmission holographique">Me Contacter</h2>
			<div class="saber" aria-hidden="true"><span class="hilt"></span><span class="blade"></span></div>
			<form class="contact-form" novalidate>
				<input type="text" name="name" placeholder="Votre nom" aria-label="Votre nom" autocomplete="name" required>
				<input type="email" name="email" placeholder="Votre email" aria-label="Votre email" autocomplete="email" required>
				<textarea name="message" placeholder="Votre message" aria-label="Votre message" rows="5" required></textarea>
				<button type="submit" class="cta-button">Envoyer</button>
				<p class="form-status" role="status" aria-live="polite" hidden></p>
			</form>
		</section>
	</main>

	<footer>
		<p>&copy; 2026 Teva - Tous droits réservés</p>
		<p class="photo-credit">Cristal en fond : photo « <a href="https://commons.wikimedia.org/wiki/File:Quartz,_Tibet.jpg" target="_blank" rel="noopener noreferrer">Quartz, Tibet</a> » de JJ Harrison, licence <a href="https://creativecommons.org/licenses/by-sa/2.5/" target="_blank" rel="noopener noreferrer">CC BY-SA 2.5</a>, via Wikimedia Commons</p>
	</footer>

	<script src="../js/contact.js"></script>
</body>
</html>
